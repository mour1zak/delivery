<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYSON BURGUER - Cadastro de Pedido</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main class="container">
        <h1 class="page-title" id="formTitle">Novo Pedido</h1>
        
        <div class="page-header">
            <a href="listagem.html" class="btn btn-secondary">← Voltar</a>
        </div>
        
        <div class="card">
            <form id="pedidoForm">
                <div class="form-group">
                    <label for="clienteId">Cliente *</label>
                    <select id="clienteId" name="clienteId" required>
                        <option value="">Selecione um cliente...</option>
                    </select>
                </div>
                
                <div class="itens-pedido">
                    <div class="itens-header">
                        <h3>Itens do Pedido</h3>
                        <button type="button" class="btn btn-primary btn-sm" onclick="pedidosController.adicionarItem()">
                            + Adicionar Item
                        </button>
                    </div>
                    
                    <div id="itensContainer">
                        <!-- Itens serão adicionados dinamicamente -->
                    </div>
                    
                    <div class="valor-total">
                        <h3>Valor Total: <span id="valorTotal">R$ 0,00</span></h3>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar Pedido</button>
                    <a href="listagem.html" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="/utils/constants.js"></script>
    <script src="/utils/api.js"></script>
    <script src="/utils/helpers.js"></script>
    <script src="/components/load-header-footer.js"></script>
    <script src="script.js"></script>
</body>
</html>
