<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYSON BURGUER - Cadastro de Produto</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main class="container">
        <h1 class="page-title" id="formTitle">Novo Produto</h1>
        
        <div class="page-header">
            <a href="listagem.html" class="btn btn-secondary">← Voltar</a>
        </div>
        
        <div class="card">
            <form id="produtoForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" required placeholder="Nome do produto" pattern="[A-Za-zÀ-ÿ0-9\s]+" title="Apenas letras e números">
                    </div>
                    
                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="preco">Preço *</label>
                        <input type="text" id="preco" name="preco" required placeholder="0,00" 
                               oninput="produtosController.formatarPreco(this)">
                    </div>
                    
                    <div class="form-group">
                        <label for="tipoProducao">Tipo de Produção</label>
                        <input type="text" id="tipoProducao" name="tipoProducao" placeholder="Ex: Padrão, Especial...">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar Produto</button>
                    <a href="listagem.html" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="/utils/constants.js"></script>
    <script src="/utils/api.js"></script>
    <script src="/utils/helpers.js"></script>
    <script src="/components/load-header-footer.js"></script>
    <script src="script.js"></script>
</body>
</html>
