<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURGUR - Gestão do Restaurante</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <!-- BANNER COM HAMBÚRGUER -->
        <div class="banner-container">
            <div class="banner-content">
                <div class="banner-text">
                    <span class="banner-the"></span>
                    <span class="banner-ultimate"></span>
                    <h1 class="banner-title">MAYSON BURGUER</h1>
                    <p class="banner-subtitle">bem vindo ao sistema administrativo</p>
                </div>
                <div class="banner-image">
                    <img src="../assets/pexels-jonathanborba-18713429-removebg-preview.png" alt="Burger Club"
                        class="banner-burger">
                </div>
            </div>
        </div>

        <!-- Título da página -->
        <h1 class="page-title">Gestão do <span class="highlight">Restaurante</span></h1>

        <!-- Cards de Status -->
        <section class="status-cards" id="statusCards">
            <div class="loading">Carregando</div>
        </section>

        <!-- Grid Principal -->
        <div class="dashboard-grid">
            <!-- Faturamento -->
            <section class="card" id="faturamentoSection">
                <div class="card-header">
                    <h2>Faturamento</h2>
                </div>
                <div id="faturamentoContent">
                    <div class="loading">Carregando</div>
                </div>
            </section>

            <!-- Ranking de Produtos -->
            <section class="card" id="rankingProdutos">
                <div class="card-header">
                    <h2>Produtos Mais Vendidos</h2>
                </div>
                <div id="rankingProdutosContent">
                    <div class="loading">Carregando</div>
                </div>
            </section>

            <!-- Ranking de Clientes -->
            <section class="card" id="rankingClientes">
                <div class="card-header">
                    <h2>🏆 Melhores Clientes</h2>
                    <span style="font-size:0.7rem; color:rgba(251,250,218,0.3);">
                        Clique no card para detalhes • Role para navegar
                    </span>
                </div>
                <div id="rankingClientesContent">
                    <div class="loading">Carregando</div>
                </div>
            </section>
        </div>

        <!-- Últimos Pedidos -->
        <section class="card mt-20">
            <div class="card-header">
                <h2>Últimos Pedidos</h2>
                <select id="statusFilter" class="filter-select">
                    <option value="">Todos os Status</option>
                </select>
            </div>
            <div id="ultimosPedidosContent">
                <div class="loading">Carregando</div>
            </div>
        </section>

        <!-- GPS Simulado -->
        <section class="card mt-20" id="gpsSection" style="display: none;">
            <div class="card-header">
                <h2>Entregas em Andamento</h2>
            </div>
            <div id="gpsContent"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/utils/constants.js"></script>
    <script src="/utils/api.js"></script>
    <script src="/utils/helpers.js"></script>
    <script src="/components/load-header-footer.js"></script>
    <script src="script.js"></script>
</body>

</html>
