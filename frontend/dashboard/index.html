<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Delivery App</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main class="container">
        <h1>📊 Dashboard</h1>
        
        <!-- Cards de Status -->
        <section class="status-cards grid grid-4" id="statusCards">
            <div class="loading">Carregando</div>
        </section>
        
        <!-- Grid Principal -->
        <div class="dashboard-grid">
            <!-- Faturamento -->
            <section class="card" id="faturamentoSection">
                <div class="card-header">
                    <h2>💰 Faturamento</h2>
                </div>
                <div id="faturamentoContent">
                    <div class="loading">Carregando</div>
                </div>
            </section>
            
            <!-- Ranking de Produtos -->
            <section class="card" id="rankingProdutos">
                <div class="card-header">
                    <h2>🏆 Produtos Mais Vendidos</h2>
                </div>
                <div id="rankingProdutosContent">
                    <div class="loading">Carregando</div>
                </div>
            </section>
            
            <!-- Ranking de Clientes -->
            <section class="card" id="rankingClientes">
                <div class="card-header">
                    <h2>👑 Melhores Clientes</h2>
                </div>
                <div id="rankingClientesContent">
                    <div class="loading">Carregando</div>
                </div>
            </section>
        </div>
        
        <!-- Últimos Pedidos -->
        <section class="card mt-20">
            <div class="card-header">
                <h2>📋 Últimos Pedidos</h2>
                <select id="statusFilter" class="filter-select">
                    <option value="">Todos os Status</option>
                </select>
            </div>
            <div id="ultimosPedidosContent">
                <div class="loading">Carregando</div>
            </div>
        </section>
        
        <!-- GPS Simulado -->
        <section class="card mt-20" id="gpsSection" style="display: none;">
            <div class="card-header">
                <h2>🗺️ Entregas em Andamento</h2>
            </div>
            <div id="gpsContent"></div>
        </section>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="/utils/constants.js"></script>
    <script src="/utils/api.js"></script>
    <script src="/utils/helpers.js"></script>
    <script src="/components/load-header-footer.js"></script>
    <script src="script.js"></script>
</body>
</html>
