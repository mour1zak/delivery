<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYSON BURGUER - Cadastro de Cliente</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main class="container">
        <h1 class="page-title" id="formTitle">Novo Cliente</h1>
        
        <div class="page-header">
            <a href="listagem.html" class="btn btn-secondary">← Voltar</a>
        </div>
        
        <div class="card">
            <form id="clienteForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" required placeholder="Nome completo">
                    </div>
                    
                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" maxlength="14">
                    </div>
                    
                    <div class="form-group">
                        <label for="telefone">Telefone *</label>
                        <input type="text" id="telefone" name="telefone" required placeholder="(00) 00000-0000" maxlength="15">
                    </div>
                    
                    <div class="form-group">
                        <label for="endereco">Endereço *</label>
                        <input type="text" id="endereco" name="endereco" required placeholder="Rua, número">
                    </div>
                    
                    <div class="form-group">
                        <label for="referencia">Referência</label>
                        <input type="text" id="referencia" name="referencia" placeholder="Ponto de referência">
                    </div>
                    
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Bairro">
                    </div>
                    
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                    <a href="listagem.html" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="/utils/constants.js"></script>
    <script src="/utils/api.js"></script>
    <script src="/utils/helpers.js"></script>
    <script src="/components/load-header-footer.js"></script>
    <script src="script.js"></script>
</body>
</html>
